[package]
name = "stunnel-relay"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Transparent TCP relay with Linux splice and independent per-flow transports"
license = "MIT"

[dependencies]
anyhow = "1"
chacha20 = "0.9"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["pipe"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"
